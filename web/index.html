<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Shared flat expenses, transparent approvals and a trustworthy pool ledger.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flait">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Flait</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="offline-install-status" role="status" style="position:fixed;bottom:4px;right:8px;font:11px system-ui;color:#64748b;z-index:9999;pointer-events:none"></div>
  <script>
  window.addEventListener('load',async()=>{
    const label=document.getElementById('offline-install-status');
    if(!('serviceWorker' in navigator)){label.textContent='Use the Android app or a browser with offline support';return;}
    try{
      const reg=await navigator.serviceWorker.register('sw.js');
      label.textContent='Preparing offline app… keep this page open';
      const update=async()=>{
        const keys=await caches.keys();
        const ready=keys.filter(k=>k.startsWith('flait-offline-'));
        let complete=false;
        for(const key of ready){const c=await caches.open(key);if(await c.match('index.html')&&await c.match('main.dart.js'))complete=true;}
        if(reg.active&&complete){label.textContent='Offline app ready · records stay on this device';return true;}return false;
      };
      if(!await update()){const timer=setInterval(async()=>{if(await update())clearInterval(timer);},2000);setTimeout(()=>clearInterval(timer),180000);}
    }catch(_){label.textContent='Offline install incomplete · reopen online to retry';}
  });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
