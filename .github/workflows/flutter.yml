name: Build Flait Android APK and Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLAIT_TEST_BUILD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Generate Android and Web platform folders
        run: |
          flutter create . --project-name flait_expense_manage --platforms=android,web --no-pub
          python3 scripts/remove_generated_test.py
          python3 scripts/prepare_android.py
          python3 scripts/prepare_assets.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build Android App Bundle (CI test signing; re-sign before Play upload)
        run: flutter build appbundle --release

      - name: Build web app
        run: |
          flutter build web --release --base-href / --no-web-resources-cdn
          python3 scripts/offline_cache.py

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flait-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: flait-android-bundle-test-signed
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: flait-web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 30
