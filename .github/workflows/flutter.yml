name: Build Expense Manage for Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/offline-device-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLAIT_TEST_BUILD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.8'
          cache: true

      - name: Prepare Android build
        run: |
          flutter create . --project-name flait_expense_manage --platforms=android --no-pub
          python3 scripts/remove_generated_test.py
          python3 scripts/prepare_android.py
          python3 scripts/prepare_assets.py

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: flait-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
