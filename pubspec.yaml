name: flait_expense_manage
description: Shared flat expense manager for Android and Web.
publish_to: "none"
version: 3.0.0+6
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: 2.18.3
  uuid: 4.6.0
  cryptography: 2.9.0
  sembast: 3.9.0
  sembast_web: 2.4.6
  path_provider: 2.1.5
  path: 1.9.1
  file_picker: 10.3.10
  local_auth: 2.3.0
  flutter_secure_storage: ^10.0.0
  pdf: ^3.11.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoNaskhArabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Regular.ttf
